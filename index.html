
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACHKILA - Effectif</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="./DOM/effectif.js"></script>
    <link rel="stylesheet" href="./style/effectif.css">
</head>

<body>

    <div id="header"></div>

    <main class="p-6">

        <!-- TITRE -->
        <h1 class="text-3xl font-bold mb-6">
            Gestion de l'effectif
        </h1>

        <div class="add-player">
            <button id="ouvrir">
                Ajouter un joueur
            </button>
        </div>

        <div class="find">
            <input
                type="text"
                id="search"
                placeholder=" Rechercher un joueur..."
            >
        </div>

        <div id="filtres" class="flex gap-3 mb-6 flex-wrap">

            <button data-poste="Tous">Tous</button>

            <button data-poste="GB">GB</button>

            <button data-poste="DEF">DEF</button>

            <button data-poste="MIL">MIL</button>

            <button data-poste="ATT">ATT</button>

        </div>

        <section
            id="liste-joueurs"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5"
        >
        </section>

        <div
            id="pagination"
            class="flex justify-center items-center gap-3 mt-8"
        >
        </div>

    </main>
</body>
</html>
